<style>
/* Layout concept: a honey-yellow and black bee-stripe band over a clean order book.
   Honey carries brand and income, black carries action and spending, red and green are kept for overdue and paid. */
:root{
  --paper:#FBF8EC; --card:#FFFFFF; --ink:#17140A; --muted:#6A6249; --line:#E7E0C6; --line-2:#F3EEDB;
  --honey:#F7B500; --honey-soft:#FFF0B8; --honey-deep:#8A5A00;
  --accent:#8A5A00; --accent-ink:#17140A; --accent-soft:#FFF0B8;
  --btn-bg:#17140A; --btn-ink:#FFC933; --band:#17140A; --band-ink:#FFC933;
  --docket:#C2271D; --docket-soft:#FBEAE8;
  --good:#11795A; --good-soft:#E0F3EB; --warn:#8A5A00; --warn-soft:#FFF0B8;
  --bar2:#17140A; --shadow:0 1px 2px rgba(23,20,10,.07);
  --f-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F0D06; --card:#1B1810; --ink:#F4EEDA; --muted:#A39A7C; --line:#352F19; --line-2:#252111;
  --honey:#FFC933; --honey-soft:#3A2F08; --honey-deep:#FFCB2F;
  --accent:#FFCB2F; --accent-ink:#0F0D06; --accent-soft:#3A2F08;
  --btn-bg:#FFC933; --btn-ink:#0F0D06; --band:#000000; --band-ink:#FFC933;
  --docket:#FF7B6F; --docket-soft:#3A1F22;
  --good:#47D3A0; --good-soft:#143328; --warn:#FFCB2F; --warn-soft:#3A2F08;
  --bar2:#7A7152; --shadow:none; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0F0D06; --card:#1B1810; --ink:#F4EEDA; --muted:#A39A7C; --line:#352F19; --line-2:#252111;
  --honey:#FFC933; --honey-soft:#3A2F08; --honey-deep:#FFCB2F;
  --accent:#FFCB2F; --accent-ink:#0F0D06; --accent-soft:#3A2F08;
  --btn-bg:#FFC933; --btn-ink:#0F0D06; --band:#000000; --band-ink:#FFC933;
  --docket:#FF7B6F; --docket-soft:#3A1F22;
  --good:#47D3A0; --good-soft:#143328; --warn:#FFCB2F; --warn-soft:#3A2F08;
  --bar2:#7A7152; --shadow:none; color-scheme:dark;}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
.page{max-width:1080px;margin:0 auto;padding-bottom:64px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px;font-weight:800}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.bar{position:relative;overflow:hidden;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:14px 0 6px;padding:16px 18px 22px;background:var(--band);color:var(--band-ink);border-radius:10px;border:1px solid var(--line)}
.bar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(135deg,#FFC933 0 9px,#17140A 9px 18px)}
.bar .label{color:#D8C377}
.brand{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.02em;display:flex;align-items:center;gap:11px;min-width:0;line-height:1.1}
.brand svg{flex:none}
.brand span.name{overflow-wrap:anywhere}
.fy{margin-left:auto;display:flex;align-items:center;gap:8px}
.fy select{padding:6px 28px 6px 10px}
.nav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 22px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;padding:10px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:3px solid transparent;margin-bottom:-1px}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--honey)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;line-height:1.2;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--docket);border-color:var(--docket)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linklike{background:none;border:0;padding:0;cursor:pointer;text-align:left}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);min-width:0}
input[type=checkbox]{width:auto;accent-color:var(--honey-deep)}
textarea{resize:vertical;min-height:64px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.field>.label{font-size:12.5px;font-weight:600;color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;min-height:38px}
.check input{margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.grid.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);cursor:pointer;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--honey);color:#17140A;border-color:var(--honey);font-weight:600}

/* surfaces */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;box-shadow:var(--shadow)}
.sect{display:flex;flex-direction:column;gap:12px}
.sect>header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;justify-content:space-between}
.empty{padding:28px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-size:17px;margin-bottom:4px}
.notice{padding:12px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);border:1px solid var(--line)}

/* ledger strip */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border-top:3px solid var(--honey);border-bottom:1px solid var(--line)}
.strip>div{padding:12px 14px 12px 0;display:flex;flex-direction:column;gap:2px;min-width:0}
.strip .v{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.neg{color:var(--docket)}
.pos{color:var(--good)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl tbody tr[data-act]{cursor:pointer}
.tbl tbody tr[data-act]:hover td{background:var(--line-2)}
.docno{font-family:var(--f-mono);font-size:13px;font-weight:500;color:var(--honey-deep);white-space:nowrap}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--line-2);color:var(--muted)}
.pill.paid,.pill.accepted{background:var(--good-soft);color:var(--good)}
.pill.overdue,.pill.declined{background:var(--docket-soft);color:var(--docket)}
.pill.part-paid,.pill.unpaid,.pill.sent,.pill.issued{background:var(--accent-soft);color:var(--accent)}
.pill.cogs,.pill.capital{background:var(--warn-soft);color:var(--warn)}
.pill.draft,.pill.invoiced,.pill.fixed,.pill.variable{background:var(--line-2);color:var(--muted)}

/* report table */
.rep{font-family:var(--f-mono);font-size:12.5px;border-collapse:collapse;width:100%}
.rep th,.rep td{padding:6px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line-2)}
.rep th:first-child,.rep td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-family:var(--f-body);font-size:13.5px;min-width:190px;z-index:1}
.rep th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
.rep tr.cat td:first-child{padding-left:26px;color:var(--muted)}
.rep tr.grp td{font-weight:600;font-family:var(--f-mono)}
.rep tr.grp td:first-child{font-family:var(--f-body);font-weight:600}
.rep tr.tot td{font-weight:600;border-top:1px solid var(--ink);border-bottom:2px solid var(--line)}
.rep tr.tot td:first-child{font-family:var(--f-body)}
.rep tr.sub td{color:var(--muted)}
.rep td.total{border-left:1px solid var(--line);font-weight:500}

/* editor */
.edhead{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.bignum{font-family:var(--f-mono);font-size:22px;font-weight:500;color:var(--honey-deep);border:0;background:transparent;padding:2px 0;width:12ch;border-bottom:1px dashed var(--line);border-radius:0}
.line{display:grid;grid-template-columns:minmax(0,1fr) 72px 104px 52px 96px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
.line.head{padding:0 0 6px}
.line .amt{text-align:right;font-variant-numeric:tabular-nums}
.line .gstlbl{display:none}
.totals{margin-left:auto;width:min(100%,320px);display:flex;flex-direction:column;gap:4px}
.totals div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.totals .due{border-top:2px solid var(--ink);padding-top:6px;margin-top:4px;font-weight:700;font-size:17px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:7px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--honey);color:#17140A;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);z-index:50;font-size:14px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--docket);color:#fff}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
svg text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
svg .gl{stroke:var(--line);stroke-width:1}

.pill.personnel{background:var(--accent-soft);color:var(--accent)}
.rep tr.head td{background:var(--honey-soft);font-weight:600;font-family:var(--f-body);font-size:13px}
.rep tr.head td:first-child{background:var(--honey-soft)}
.rep tr.gtot td{font-weight:600;border-top:1px solid var(--line)}
.rep tr.gtot td:first-child{font-family:var(--f-body)}
.rline{display:grid;grid-template-columns:minmax(0,1fr) 130px 86px 52px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
.rline.head{padding:0 0 6px}
.rline .rq{display:flex;align-items:center;gap:6px}
.rline .rc{text-align:right;font-variant-numeric:tabular-nums}
.sline{display:grid;grid-template-columns:150px minmax(0,1fr) 120px 34px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
.up{color:var(--docket)}.down{color:var(--good)}
.share{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;min-width:44px}.share i{display:block;height:100%;background:var(--honey)}
.big{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.costpanel{display:flex;flex-direction:column;gap:6px;margin-left:auto;width:min(100%,380px)}
.costpanel div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .rline{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}
  .rline.head{display:none}
  .rline .ri{grid-column:1/-1}
  .rline .rs{display:none}
  .sline{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}
  .sline .sd{grid-column:1/-1}
  .line{grid-template-columns:repeat(3,minmax(0,1fr)) 34px}
  .line.head{display:none}
  .line .desc{grid-column:1/-1}
  .line .gstc{display:flex;align-items:center;gap:6px}
  .line .gstlbl{display:inline}
  .line .amt{grid-column:span 2}
  .strip .v{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<script id="engine">
const Engine=(function(){
'use strict';
const pad=n=>String(n).padStart(2,'0');
const r2=n=>{n=Number(n)||0;return Math.round((n+(n<0?-1e-9:1e-9))*100)/100;};
const DEFAULTS={businessName:'Little Honey Treats',abn:'',address:'',email:'',phone:'',gstRegistered:true,gstRate:10,pricesIncludeGst:false,
  termsDays:14,invoicePrefix:'INV-',quotePrefix:'QUO-',labourRate:60,kmRate:0.88,claimKm:true,
  bankName:'',bsb:'',accountNo:'',invoiceFooter:'Thank you for choosing Little Honey Treats.'};
const CATS={
  cogs:['Ingredients','Packaging','Decorations & toppers','Boxes & boards','Freight in','Direct labour'],
  personnel:['Salaries & wages','Casual wages','Commissions & incentives','Sick & annual leave','Long service leave','Payroll tax','Workers compensation','Superannuation','Staff training','Staff amenities'],
  variable:['Vehicle running costs','Vehicle (km claim)','Office supplies & postage','Tools, uniforms & other supplies','Advertising & promotion','Advertising – internet','Computer & software','Cleaning & security','Accounting, audit & legal','Outside services','Travel, accommodation & entertainment','Travel costs (tolls, parking)','Communications, phone & mobiles','Equipment hire & lease rental','Freight & delivery','Bank charges','Payment & platform fees','Subscriptions & donations','Repairs & maintenance – equipment','Training','Remakes & goodwill','Non-deductible'],
  fixed:['Rent & lease','Insurance – general','Insurance – public & product liability','Repairs & maintenance – property','Rates & taxes','Heat, light & power','Licences & registrations','Home office','Lease payments','Depreciation'],
  capital:['Equipment','Tools','Vehicle']};
// Class keys are stored on expenses: cogs, personnel, variable (shown as "Semi-fixed"), fixed, capital.
const CLS_LABEL={cogs:'Cost of goods',personnel:'Personnel',variable:'Semi-fixed',fixed:'Fixed',capital:'Equipment'};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function todayISO(d){d=d||new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function addDays(iso,n){const p=iso.split('-').map(Number);const t=new Date(Date.UTC(p[0],p[1]-1,p[2]+n));return t.getUTCFullYear()+'-'+pad(t.getUTCMonth()+1)+'-'+pad(t.getUTCDate());}
function fyStart(iso){const y=+iso.slice(0,4),m=+iso.slice(5,7);return m>=7?y:y-1;}
const fyLabel=sy=>'FY'+sy+'-'+String(sy+1).slice(2);
const fyRange=sy=>[sy+'-07-01',(sy+1)+'-06-30'];
function quarterRange(sy,q){const s=[[sy+'-07-01',sy+'-09-30'],[sy+'-10-01',sy+'-12-31'],[(sy+1)+'-01-01',(sy+1)+'-03-31'],[(sy+1)+'-04-01',(sy+1)+'-06-30']];return s[q-1];}
function quarterOf(iso){const m=+iso.slice(5,7);return m>=7&&m<=9?1:m>=10?2:m<=3?3:4;}
function periodRange(sy,p){return p==='all'?fyRange(sy):quarterRange(sy,+String(p).slice(1));}
function monthList(from,to){const out=[];let y=+from.slice(0,4),m=+from.slice(5,7);const y2=+to.slice(0,4),m2=+to.slice(5,7);
  while(y<y2||(y===y2&&m<=m2)){out.push(y+'-'+pad(m));m++;if(m>12){m=1;y++;}}return out;}
const monthLabel=k=>MON[+k.slice(5,7)-1]+' '+k.slice(2,4);
const inRange=(d,a,b)=>!!d&&d>=a&&d<=b;
const rateOf=S=>S.gstRegistered?(Number(S.gstRate)||0)/100:0;

function lineCalc(l,taxMode,S){
  const rate=rateOf(S),amt=(+l.qty||0)*(+l.price||0),taxable=!!l.gst&&rate>0;
  let net,gst,gross;
  if(taxMode==='inc'){gross=amt;gst=taxable?amt*rate/(1+rate):0;net=gross-gst;}
  else{net=amt;gst=taxable?amt*rate:0;gross=net+gst;}
  return {net,gst,gross,taxable};
}
function docTotals(doc,S){
  let net=0,gst=0,gross=0,free=0,cost=0,hasCost=false;
  for(const l of (doc.lines||[])){
    const c=lineCalc(l,doc.taxMode,S);net+=c.net;gst+=c.gst;gross+=c.gross;if(!c.taxable)free+=c.gross;
    if(l.cost!==undefined&&l.cost!==''&&l.cost!==null&&+l.cost>0){cost+=(+l.qty||0)*(+l.cost);hasCost=true;}
  }
  let sub,g,total;
  if(doc.taxMode==='inc'){total=r2(gross);g=r2(gst);sub=r2(total-g);}
  else{sub=r2(net);g=r2(gst);total=r2(sub+g);}
  const paid=r2((doc.payments||[]).reduce((a,p)=>a+(+p.amount||0),0));
  const freeGross=r2(free);
  return {sub,gst:g,total,paid,balance:r2(total-paid),freeGross,cost:r2(cost),
    margin:hasCost&&sub>0?r2(sub-cost):null,marginPct:hasCost&&sub>0?(sub-cost)/sub:null};
}
function docStatus(doc,t,today){
  if(doc.type==='quote')return doc.status||'draft';
  if(t.total>0&&t.balance<=0.004)return 'paid';
  if(doc.status==='draft'&&!(doc.payments&&doc.payments.length))return 'draft';
  if(doc.due&&doc.due<today)return 'overdue';
  if(t.paid>0)return 'part-paid';
  return 'unpaid';
}

/* ---------- plumbing ---------- */
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='toast show'+(kind==='err'?' err':'');clearTimeout(toast.t);toast.t=setTimeout(()=>{t.className='toast';},3400);}
const errMsg=e=>e&&e.code==='quota_exceeded'?'The database is full. Delete some records and try again.':e&&e.code==='invalid_argument'?'You do not have permission to change this data.':'Could not save. Please try again.';
const newId=c=>S.db.collection(c).doc().id;
async function put(coll,id,obj){
  if(!S.db){toast('Saving is not available in this view.','err');return false;}
  const body=Object.assign({},obj);delete body.id;
  try{await S.db.collection(coll).doc(id).set(JSON.parse(JSON.stringify(body)));return true;}catch(e){toast(errMsg(e),'err');return false;}
}
async function del(coll,id){
  if(!S.db){toast('Saving is not available in this view.','err');return false;}
  try{await S.db.collection(coll).doc(id).delete();return true;}catch(e){toast(errMsg(e),'err');return false;}
}
function armed(el,label){
  if(el.dataset.armed==='1')return true;
  el.dataset.armed='1';const orig=el.textContent;el.textContent=label||'Click again to confirm';el.classList.add('danger');
  setTimeout(()=>{if(el.isConnected){el.dataset.armed='';el.textContent=orig;}},4000);return false;
}
let renderQueued=false,pendingRender=false;
function scheduleRender(){
  const a=document.activeElement;
  if(a&&a!==document.body&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#main').contains(a)){pendingRender=true;return;}
  if(renderQueued)return;renderQueued=true;
  requestAnimationFrame(()=>{renderQueued=false;pendingRender=false;render();});
}
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(scheduleRender,0);});

function subscribe(){
  const db=S.db,onErr=e=>{S.err=e;scheduleRender();};
  COLLS.forEach(name=>{
    db.collection(name).onSnapshot(snap=>{S[name]=snap.docs.map(x=>Object.assign({},x.data(),{id:x.id}));S.loaded[name]=true;scheduleRender();},onErr);
  });
  db.doc('settings/business').onSnapshot(s=>{S.settingsExists=s.exists;S.settings=Object.assign({},E.DEFAULTS,s.exists?s.data():{});S.loaded.settings=true;scheduleRender();},onErr);
}
const allLoaded=()=>COLLS.concat(['settings']).every(k=>S.loaded[k]);

function fyOptions(){

  const add=d=>{if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d))set.add(E.fyStart(d));};

function niceMax(m){const mag=Math.pow(10,Math.floor(Math.log10(m)));for(const f of [1,2,4,5,10])if(f*mag>=m)return f*mag;return 10*mag;}
function kfmt(v){return v>=1000?'$'+(v/1000).toFixed(v%1000?1:0).replace(/\.0$/,'')+'k':'$'+Math.round(v);}
function chartSVG(months,inc,exp){
  const W=Math.max(300,Math.min(760,($('#main').clientWidth||640)-2)),H=230,L=44,R=6,T=10,B=26,pw=W-L-R,ph=H-T-B;
  const max=niceMax(Math.max(1,Math.max.apply(null,inc),Math.max.apply(null,exp)));
  const gw=pw/months.length,bw=Math.max(3,Math.min(18,gw*.34));let s='';
  for(let i=0;i<=4;i++){const v=max*i/4,y=T+ph-ph*i/4;s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+kfmt(v)+'</text>';}
  months.forEach((m,i)=>{
    const x=L+gw*i+(gw-2*bw-2)/2,hi=ph*inc[i]/max,he=ph*exp[i]/max;
    s+='<rect x="'+x+'" y="'+(T+ph-hi)+'" width="'+bw+'" height="'+Math.max(0,hi)+'" rx="2" fill="var(--honey)"><title>'+esc(E.monthLabel(m))+' income '+esc(money(inc[i]))+'</title></rect>';
    s+='<rect x="'+(x+bw+2)+'" y="'+(T+ph-he)+'" width="'+bw+'" height="'+Math.max(0,he)+'" rx="2" fill="var(--bar2)"><title>'+esc(E.monthLabel(m))+' expenses '+esc(money(exp[i]))+'</title></rect>';
    s+='<text x="'+(L+gw*i+gw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+E.MON[+m.slice(5,7)-1]+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Monthly income and expenses, ex GST">'+s+'</svg>';
}

async function saveDraft(opts){

  S.busy=true;

      const m=S.customers.find(c=>c.name.toLowerCase()===name.toLowerCase());
      if(m)cid=m.id;else{cid=newId('customers');const ok=await put('customers',cid,{name,email:'',phone:'',abn:'',address:''});if(!ok)return false;}
    }else cid='';
    const lines=d.lines.filter(l=>(l.desc||'').trim()||num(l.price)).map(l=>({id:l.id,desc:(l.desc||'').trim(),qty:num(l.qty),price:num(l.price),gst:!!l.gst,cost:l.cost===''||l.cost==null?'':num(l.cost),productId:l.productId||''}));

function vBalance(){
  const [from]=E.fyRange(S.fy),[,to]=E.fyRange(S.fy),date=bsDate(),d0=E.addDays(from,-1);
  const cur=E.buildBalance(data(),S.settings,date),prv=E.buildBalance(data(),S.settings,d0);
  const rows={};const order=[];
  const take=(bal,col)=>bal.lines.forEach(l=>{const k=l.section+'|'+l.key;if(!rows[k]){rows[k]={section:l.section,group:l.group,label:l.label,cur:0,prv:0,note:''};order.push(k);}rows[k][col]=l.amount;if(col==='cur'||!rows[k].note)rows[k].note=l.note;});
  take(prv,'prv');take(cur,'cur');
  const GO={asset:['Cash and other assets','Receivables','Stock on hand','Equipment'],liability:['Tax','Other liabilities']};
  const sect=(sec,title,tp,tc)=>{
    const list=order.map(k=>rows[k]).filter(r=>r.section===sec);
    const groups=GO[sec].filter(g=>list.some(r=>r.group===g)).concat([...new Set(list.map(r=>r.group))].filter(g=>!GO[sec].includes(g)));
    let o='<tr class="head"><td colspan="4">'+title+'</td></tr>';

function plRows(pl,showAll){

  const tot=(label,o,cls)=>'<tr class="'+(cls||'tot')+'"><td>'+label+'</td>'+cells(o.vals,o.total)+'</tr>';
  const sec=(label,g,totalLabel)=>(g.cats.length||showAll?head(label)+g.cats.map(cat).join('')+tot(totalLabel,g):'');
  let h=head('Income')+'<tr class="cat"><td>Sales (ex GST)</td>'+cells(pl.income.vals,pl.income.total)+'</tr>'+tot('Total income',pl.income);

const ACT={
  'load-examples':()=>loadExamples(),'clear-examples':()=>clearExamples(),
  'new-doc':el=>startDoc(el.dataset.type),
  'open-doc':el=>openDoc(el.dataset.id),
  'sales-filter':el=>{S.ui.sales.filter=el.dataset.v;render();},
  'doc-back':el=>{if(S.ui.sales.dirty&&!armed(el,'Discard changes?'))return;S.ui.sales.draft=null;S.ui.sales.dirty=false;render();},
  'doc-save':()=>saveDraft().then(ok=>{if(ok)render();}),
  'doc-add-line':()=>{syncDraftFromDom();S.ui.sales.draft.lines.push(blankLine());S.ui.sales.dirty=true;render();},
  'doc-del-line':el=>{syncDraftFromDom();const d=S.ui.sales.draft;d.lines.splice(+el.dataset.i,1);if(!d.lines.length)d.lines.push(blankLine());S.ui.sales.dirty=true;render();},
  'doc-add-pay':async()=>{
    const d=S.ui.sales.draft;syncDraftFromDom();const amt=num($('#pay-amt').value),date=$('#pay-date').value;
    if(!date||!amt){toast('Add a date and an amount.','err');return;}
    d.payments.push({id:'p'+Math.random().toString(36).slice(2,8),date,amount:amt,method:$('#pay-method').value});
    const stSel=$('#ed-status');if(d.status==='draft'){d.status='issued';if(stSel)stSel.value='issued';}
    if(await saveDraft({quiet:true})){toast('Payment recorded');render();}
  },
  'doc-del-pay':async el=>{const d=S.ui.sales.draft;syncDraftFromDom();d.payments=d.payments.filter(p=>p.id!==el.dataset.pid);if(await saveDraft({quiet:true})){toast('Payment removed');render();}},
  'doc-convert':async()=>{
    const q=S.ui.sales.draft;if(!(await saveDraft({quiet:true})))return;
    const issued=S.today,inv={type:'invoice',number:E.nextNumber(S.docs,'invoice',S.settings.invoicePrefix),customerId:q.customerId,customerName:q.customerName,issued,due:E.addDays(issued,+S.settings.termsDays||0),status:'draft',taxMode:q.taxMode,lines:JSON.parse(JSON.stringify(q.lines)),notes:'',payments:[],fromQuote:q.id};
    const id=newId('docs');if(!(await put('docs',id,inv)))return;
    const qb=Object.assign({},S.docs.find(x=>x.id===q.id)||{},{status:'invoiced',invoiceId:id});await put('docs',q.id,qb);
    toast('Invoice '+inv.number+' created from the quote');S.ui.sales.draft=Object.assign({id,dueAuto:false},inv);S.ui.sales.dirty=false;render();
  },
  'doc-download':async()=>{const d=S.ui.sales.draft;syncDraftFromDom();await saveFile((d.number||'document').replace(/[^\w.-]+/g,'_')+'.html',invoiceHTML(d));},
  'doc-delete':async el=>{if(!armed(el,'Click again to delete'))return;const d=S.ui.sales.draft;if(await del('docs',d.id)){S.ui.sales.draft=null;S.ui.sales.dirty=false;toast('Deleted '+d.number);render();}},
  'exp-filter':el=>{S.ui.exp.cls=el.dataset.v;render();},
  'exp-more':()=>{S.ui.exp.limit+=150;render();},
  'exp-edit':el=>{S.ui.exp.edit=el.dataset.id;render();window.scrollTo(0,0);},
  'exp-cancel':()=>{S.ui.exp.edit=null;render();},
  'exp-del':async el=>{if(!armed(el,'Click again to delete'))return;if(await del('expenses',el.dataset.id)){if(S.ui.exp.edit===el.dataset.id)S.ui.exp.edit=null;toast('Expense deleted');}},
  'time-kind':el=>{const f=$('form[data-form="time"]');const keep=f?{date:f.elements.date.value,hours:f.elements.hours.value,note:f.elements.note.value}:null;S.ui.time.kind=el.dataset.v;if(S.ui.time.edit)S.ui.time.edit=null;render();if(keep){const g=$('form[data-form="time"]');g.elements.date.value=keep.date;g.elements.hours.value=keep.hours;g.elements.note.value=keep.note;}},
  'time-edit':el=>{S.ui.time.edit=el.dataset.id;render();window.scrollTo(0,0);},
  'time-cancel':()=>{S.ui.time.edit=null;render();},
  'time-del':async el=>{if(!armed(el,'Click again to delete'))return;if(await del('time',el.dataset.id)){if(S.ui.time.edit===el.dataset.id)S.ui.time.edit=null;toast('Entry deleted');}},
  'rep-tab':el=>{S.ui.rep.tab=el.dataset.v;render();},
  'to-bas':()=>{S.ui.rep.tab='bas';},
  'rep-csv':()=>{const r=reportCSV();saveFile(r.name,r.text);},
  'cust-edit':el=>{S.ui.lists.custEdit=el.dataset.id;render();window.scrollTo(0,0);},'cust-cancel':()=>{S.ui.lists.custEdit=null;render();},
  'cust-del':async el=>{if(!armed(el,'Click again to delete'))return;if(await del('customers',el.dataset.id))toast('Customer deleted. Their past documents keep the name.');},
  'prod-edit':el=>{S.ui.lists.prodEdit=el.dataset.id;render();window.scrollTo(0,0);},'prod-cancel':()=>{S.ui.lists.prodEdit=null;render();},
  'prod-del':async el=>{if(!armed(el,'Click again to delete'))return;if(await del('products',el.dataset.id))toast('Item deleted');},
  'stock-tab':el=>{S.ui.stock.tab=el.dataset.v;render();},
  'ing-edit':el=>{S.ui.stock.ingEdit=el.dataset.id;render();window.scrollTo(0,0);},'ing-cancel':()=>{S.ui.stock.ingEdit=null;render();},
  'ing-del':async el=>{
    const used=S.recipes.filter(r=>(r.lines||[]).some(l=>l.ingredientId===el.dataset.id));
    if(used.length){toast('Used in '+used.map(r=>r.name).join(', ')+'. Remove it from the recipe first.','err');return;}
    if(!armed(el,'Click again to delete'))return;if(await del('ingredients',el.dataset.id)){if(S.ui.stock.ingEdit===el.dataset.id)S.ui.stock.ingEdit=null;toast('Ingredient deleted');}},
  'recipe-new':()=>{S.ui.stock.recipe=blankRecipe();S.ui.stock.recipeDirty=false;render();},
  'recipe-edit':el=>{const r=S.recipes.find(x=>x.id===el.dataset.id);if(!r)return;S.ui.stock.recipe=JSON.parse(JSON.stringify(r));if(!S.ui.stock.recipe.lines.length)S.ui.stock.recipe.lines.push(blankRLine());S.ui.stock.recipeDirty=false;render();window.scrollTo(0,0);},
  'recipe-back':el=>{if(S.ui.stock.recipeDirty&&!armed(el,'Discard changes?'))return;S.ui.stock.recipe=null;S.ui.stock.recipeDirty=false;render();},
  'recipe-add-line':()=>{syncRecipe();S.ui.stock.recipe.lines.push(blankRLine());S.ui.stock.recipeDirty=true;render();},
  'recipe-del-line':el=>{syncRecipe();const d=S.ui.stock.recipe;d.lines.splice(+el.dataset.i,1);if(!d.lines.length)d.lines.push(blankRLine());S.ui.stock.recipeDirty=true;render();},
  'recipe-del':async el=>{
    const pr=S.products.filter(p=>p.recipeId===el.dataset.id);
    if(pr.length){toast('Used by '+pr.map(p=>p.name).join(', ')+'. Unlink it in Customers & items first.','err');return;}
    if(!armed(el,'Click again to delete'))return;if(await del('recipes',el.dataset.id))toast('Recipe deleted');},
  'take-new':()=>{const [f]=E.fyRange(S.fy);S.ui.stock.take={date:S.today,note:'',lines:[{group:'Ingredients',desc:'',value:''}]};S.ui.stock.takeDirty=false;render();},
  'take-edit':el=>{const t=S.stocktakes.find(x=>x.id===el.dataset.id);if(!t)return;S.ui.stock.take=JSON.parse(JSON.stringify(t));S.ui.stock.takeDirty=false;render();window.scrollTo(0,0);},
  'take-back':el=>{if(S.ui.stock.takeDirty&&!armed(el,'Discard changes?'))return;S.ui.stock.take=null;S.ui.stock.takeDirty=false;render();},
  'take-add-line':()=>{syncTake();S.ui.stock.take.lines.push({group:'Ingredients',desc:'',value:''});S.ui.stock.takeDirty=true;render();},
  'take-del-line':el=>{syncTake();const d=S.ui.stock.take;d.lines.splice(+el.dataset.i,1);if(!d.lines.length)d.lines.push({group:'Ingredients',desc:'',value:''});S.ui.stock.takeDirty=true;render();},
  'take-fill':()=>{syncTake();const by={};S.ingredients.forEach(i=>{const v=E.unitCost(i)*(+i.onHand||0);if(!v)return;const g=i.category==='Packaging'?'Packaging':i.category==='Decoration'?'Decorations':'Ingredients';by[g]=(by[g]||0)+v;});
    const keys=Object.keys(by);if(!keys.length){toast('No on-hand quantities on your ingredients yet.','err');return;}
    S.ui.stock.take.lines=keys.map(g=>({group:g,desc:'From ingredient list',value:E.r2(by[g])}));S.ui.stock.takeDirty=true;render();},
  'take-del':async el=>{if(!armed(el,'Click again to delete'))return;if(await del('stocktakes',el.dataset.id))toast('Stocktake deleted');},
  'bal-del':async el=>{if(!armed(el,'Click again to delete'))return;if(await del('balances',el.dataset.id))toast('Balance deleted');},
  'export-json':()=>exportJSON(),'export-csv':el=>exportCSV(el.dataset.k),
  'restore-go':()=>restoreGo(),'restore-cancel':()=>{S.ui.restore=null;render();}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!$('#main').contains(el))return;if(e.target.closest('a[href]')&&el.tagName==='TR')return;const fn=ACT[el.dataset.act];if(fn)fn(el,e);});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const k=f.dataset.form;
  if(k==='expense')saveExpense(f);else if(k==='ingredient')saveIngredient(f);else if(k==='recipe')saveRecipe();else if(k==='take')saveTake();
  else if(k==='balance'){const fd=new FormData(f),name=String(fd.get('name')||'').trim(),amount=num(fd.get('amount'));if(!name||!fd.get('date')){toast('Add a name and a date.','err');return;}
    put('balances',newId('balances'),{date:fd.get('date'),side:fd.get('side'),name,amount}).then(ok=>{if(ok){toast('Balance saved');render();}});}
  else if(k==='time')saveTime(f);else if(k==='settings')saveSettings(f);
  else if(k==='customer'){const fd=new FormData(f),ed=S.ui.lists.custEdit?S.customers.find(x=>x.id===S.ui.lists.custEdit):null,g=n=>String(fd.get(n)||'').trim();
    put('customers',ed?ed.id:newId('customers'),Object.assign({},ed&&ed.example?{example:true}:{},{name:g('name'),email:g('email'),phone:g('phone'),abn:g('abn'),address:g('address')})).then(ok=>{if(ok){S.ui.lists.custEdit=null;toast('Customer saved');render();}});}
  else if(k==='product'){const fd=new FormData(f),ed=S.ui.lists.prodEdit?S.products.find(x=>x.id===S.ui.lists.prodEdit):null;
    put('products',ed?ed.id:newId('products'),Object.assign({},ed&&ed.example?{example:true}:{},{name:String(fd.get('name')||'').trim(),price:num(fd.get('price')),recipeId:String(fd.get('recipeId')||''),cost:fd.get('recipeId')?'':(fd.get('cost')===''?'':num(fd.get('cost'))),gst:S.settings.gstRegistered?!!f.elements.gst&&f.elements.gst.checked:true})).then(ok=>{if(ok){S.ui.lists.prodEdit=null;toast('Item saved');render();}});}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='sales-q'){S.ui.sales.q=t.value;const p=t.selectionStart;render();const n=$('#sales-q');if(n){n.focus();n.setSelectionRange(p,p);}return;}
  if(t.id==='exp-q'){S.ui.exp.q=t.value;const p=t.selectionStart;render();const n=$('#exp-q');if(n){n.focus();n.setSelectionRange(p,p);}return;}
  if(S.view==='expenses'&&/^x-(amt|pct|gst)$/.test(t.id))paintExpensePreview();
  if(S.view==='stock'){
    if(/^i-(size|price)$/.test(t.id)){paintIngPreview();return;}
    if(t.closest('#recipe-ed')){syncRecipe();S.ui.stock.recipeDirty=true;paintRecipe();return;}
    if(t.closest('#take-ed')){syncTake();S.ui.stock.takeDirty=true;paintTake();return;}
  }
  const d=S.ui.sales.draft;if(!d||S.view!=='sales')return;
  const row=t.closest('.line[data-i]');
  if(row&&t.dataset.lf){const l=d.lines[+row.dataset.i];if(!l)return;const k=t.dataset.lf;l[k]=k==='gst'?t.checked:t.value;if(k==='desc'&&l.productId&&t.value!==l.desc){l.productId='';}S.ui.sales.dirty=true;paintTotals();return;}
  if(/^ed-/.test(t.id)){S.ui.sales.dirty=true;syncDraftFromDom();
    if(t.id==='ed-issued'&&d.dueAuto&&d.type==='invoice'){d.due=E.addDays(d.issued,+S.settings.termsDays||0);$('#ed-due').value=d.due;}
    if(t.id==='ed-due')d.dueAuto=false;paintTotals();}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fysel'){S.fy=+t.value;S.ui.rep.bas=null;S.ui.rep.bsDate=null;render();return;}
  if(t.id==='rep-period'){S.ui.rep.period=t.value;render();return;}
  if(t.id==='bas-period'){S.ui.rep.bas=t.value;render();return;}
  if(t.id==='x-cls'){const dl=$('#catlist');if(dl)dl.innerHTML=catOptions(t.value);const lw=$('#x-lifewrap');if(lw)lw.hidden=t.value!=='capital';
    const g=$('#x-gst');if(g&&!S.ui.exp.edit&&t.value==='personnel'){g.checked=false;}paintExpensePreview();return;}
  if(t.id==='bs-date'){S.ui.rep.bsDate=t.value||null;render();return;}
  if(t.id==='rep-showall'){S.ui.rep.showAll=t.checked;render();return;}
  if(t.id==='i-unit'){paintIngPreview();return;}
  if(t.id==='p-recipe'){const c=$('#p-cost');if(c){const r=S.recipes.find(x=>x.id===t.value);c.disabled=!!r;if(r)c.value=productCost({recipeId:r.id});}return;}
  if(S.view==='stock'&&t.closest('#recipe-ed')&&t.dataset.rf==='ingredientId'){syncRecipe();S.ui.stock.recipeDirty=true;render();return;}
  if(t.id==='restore-file'&&t.files&&t.files[0]){readBackup(t.files[0]);return;}
  const d=S.ui.sales.draft;if(!d||S.view!=='sales')return;
  const row=t.closest('.line[data-i]');
  if(row&&t.dataset.lf==='desc'){const l=d.lines[+row.dataset.i],p=S.products.find(x=>x.name===t.value);
    if(l&&p&&!l.productId){syncDraftFromDom();l.productId=p.id;l.price=p.price;l.gst=!!p.gst;l.cost=p.recipeId?productCost(p):(p.cost===undefined?'':p.cost);S.ui.sales.dirty=true;render();}return;}
  if(t.id==='ed-tax'){syncDraftFromDom();S.ui.sales.dirty=true;render();}
});

/* ---------- start ---------- */
(async function init(){
  const use=window.claude&&window.claude.use?window.claude.use.bind(window.claude):async()=>null;
  setView();
  const [db,dl,assets]=await Promise.all([use('db'),use('downloads'),use('assets')]);
  S.db=db;S.dl=dl;S.assets=assets;S.dbChecked=true;
  if(db)subscribe();render();
})();
window.__books={S,E,render,ACT};
})();
</script>

</body></html>
